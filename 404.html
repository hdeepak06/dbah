<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | DBAH Quad Digital Labs</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      position: relative;
      z-index: 2;
    }
    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 900;
      line-height: 1;
      background: var(--grad-gold);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .error-title {
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      color: #FFFFFF;
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 480px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .error-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 50%;
      margin-bottom: 24px;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
    }
  </style>
</head>
<body>
  <canvas id="particles-canvas" aria-hidden="true"></canvas>

  <main class="error-wrapper">
    <img src="assets/images/dbah-quad-logo.png" alt="DBAH Quad Logo" class="error-logo">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The digital path you are seeking does not exist or has been relocated within the DBAH Quad network. Let us guide you back to innovation.
    </p>
    <a href="index.html" class="btn btn-gold btn-lg">
      <span>Return to Homepage</span>
      <span class="btn-arrow" aria-hidden="true">→</span>
    </a>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
