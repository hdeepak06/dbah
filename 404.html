<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 — Page Not Found | DBAH Quad Digital Labs</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 20px;
      position: relative;
      z-index: 2;
      background: var(--bg-body);
      color: var(--text-primary);
    }
    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(5rem, 14vw, 8.5rem);
      font-weight: 800;
      line-height: 1;
      color: var(--gold-400);
      margin-bottom: 12px;
    }
    .error-title {
      font-family: var(--font-heading);
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      color: var(--text-pure);
      margin-bottom: 12px;
    }
    .error-desc {
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--text-secondary);
      max-width: 480px;
      margin-bottom: 32px;
      line-height: 1.65;
    }
    .error-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 50%;
      border: 2px solid var(--gold-500);
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(197, 160, 89, 0.3);
    }
  </style>
</head>
<body class="dark-theme">
  <canvas id="particles-canvas" aria-hidden="true"></canvas>

  <main class="error-wrapper">
    <picture>
      <source srcset="assets/images/dbah-quad-logo.webp" type="image/webp">
      <img src="assets/images/dbah-quad-logo.png" alt="DBAH Quad Logo" class="error-logo" width="72" height="72">
    </picture>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The digital path you are seeking does not exist or has been relocated within the DBAH Quad network. Return to explore our digital engineering work.
    </p>
    <a href="index.html" class="btn btn-gold btn-lg">
      <span>Return to Homepage</span>
      <span class="btn-arrow" aria-hidden="true">→</span>
    </a>
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
