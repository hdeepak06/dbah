<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | DBAH Quad Digital Labs</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      position: relative;
      z-index: 2;
      background: var(--hero-bg);
      color: var(--hero-text);
    }
    .error-code {
      font-family: var(--font-serif);
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 800;
      line-height: 1;
      color: var(--champagne-gold);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      margin-bottom: 16px;
    }
    .error-title {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 3.5vw, 2.5rem);
      color: var(--cream-white);
      margin-bottom: 12px;
    }
    .error-desc {
      font-family: var(--font-sans);
      font-size: 1rem;
      color: var(--hero-text-muted);
      max-width: 480px;
      margin-bottom: 32px;
      line-height: 1.65;
    }
    .error-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 50%;
      border: 2px solid var(--champagne-gold);
      margin-bottom: 24px;
      box-shadow: 0 0 25px rgba(197, 160, 82, 0.45);
    }
  </style>
</head>
<body>
  <canvas id="particles-canvas" aria-hidden="true"></canvas>

  <main class="error-wrapper">
    <picture><source srcset="assets/images/dbah-quad-logo.webp" type="image/webp"><img src="assets/images/dbah-quad-logo.png" alt="DBAH Quad Logo" class="error-logo"></picture>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The digital path you are seeking does not exist or has been relocated within the DBAH Quad network. Let us guide you back to innovation.
    </p>
    <a href="index.html" class="btn btn-gold btn-lg">
      <span>Return to Homepage</span>
      <span class="btn-arrow" aria-hidden="true">→</span>
    </a>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
